services:
  - type: web
    name: zalo-telegram-bridge
    runtime: node
    buildCommand: npm install
    startCommand: node src/index.js
    healthCheckPath: /health
    envVars:
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: TELEGRAM_CHAT_ID
        sync: false
      - key: SESSION_JSON_BASE64
        sync: false
      - key: DB_PATH
        value: /tmp/data/messages.db
      - key: SESSION_PATH
        value: /tmp/data/session.json
      - key: REPORT_CRON
        value: "0 8 * * *"
