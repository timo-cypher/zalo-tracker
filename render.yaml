# Render Blueprint — Zalo Archive v2 (FREE stack: $0/tháng)
#
# Kiến trúc:
#   Render free     = backend + frontend + WebSocket Zalo
#   Supabase free   = Postgres (DB + sessions) qua DATABASE_URL
#   UptimeRobot     = ping /health mỗi 5 phút để service không ngủ
#                     (ngủ = mất tin nhắn realtime!)
#   Cloudflare R2   = (tuỳ chọn) media vĩnh viễn
#
# Deploy: Render Dashboard -> New -> Blueprint -> chọn repo này
services:
  - type: web
    name: zalo-archive
    runtime: node
    plan: free             # $0 — NHỚ setup UptimeRobot (xem README mục Deploy)
    region: singapore
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      # ===== Bảo mật web (BẮT BUỘC khi deploy công khai) =====
      - key: WEB_USER
        sync: false
      - key: WEB_PASSWORD
        sync: false
      # ===== Database (Supabase Postgres — BẮT BUỘC trên free plan) =====
      # Supabase Dashboard -> Project Settings -> Database -> Connection string
      # (URI, dùng pooler connection cho serverless-free)
      - key: DATABASE_URL
        sync: false
      # ===== Cloudflare R2 archive media (tuỳ chọn) =====
      - key: R2_ACCOUNT_ID
        sync: false
      - key: R2_ACCESS_KEY_ID
        sync: false
      - key: R2_SECRET_ACCESS_KEY
        sync: false
      - key: R2_BUCKET
        sync: false
      - key: R2_PUBLIC_BASE
        sync: false
